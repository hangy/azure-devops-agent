name: ci-bake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 3'
  workflow_dispatch:
    inputs:
      trivy_scan:
        description: 'Run Trivy vulnerability scan (true/false)'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TRIVY_SCAN: ${{ github.event.inputs.trivy_scan || 'false' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all targets with bake (non-main local build only)
        if: github.ref != 'refs/heads/main'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl

      - name: Build all targets with bake (main - push to GHCR by digest)
        if: github.ref == 'refs/heads/main'
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          PUSH_GHCR: true
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          source: .
          files: docker-bake.hcl
          push: true

      - name: Inspect pushed images
        if: github.ref == 'refs/heads/main'
        run: |
          for TARGET in plain dotnet java android; do
            echo "=== ${TARGET} ==="
            docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
          done

      - name: Install Trivy
        if: github.ref == 'refs/heads/main' && env.TRIVY_SCAN == 'true'
        run: |
          TRIVY_VERSION=0.69.1
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -o trivy.tar.gz
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Vulnerability scan (fail on HIGH/CRITICAL)
        if: github.ref == 'refs/heads/main' && env.TRIVY_SCAN == 'true'
        run: |
          set -euo pipefail
          FAILED=0
          for TARGET in plain dotnet java android; do
            REF=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
            echo "Scanning $REF"
            trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --timeout 10m "$REF" || FAILED=1
          done
          if [ $FAILED -ne 0 ]; then
            echo "Vulnerability threshold exceeded (HIGH/CRITICAL). Failing build before signing." >&2
            exit 1
          fi

      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        run: |
          COSIGN_VERSION=v3.0.4
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o cosign
          chmod +x cosign
          sudo mv cosign /usr/local/bin/
          cosign version

      - name: Sign images and attestations (keyless)
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          for TARGET in plain dotnet java android; do
            REF=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
            DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "Signing $REF@$DIGEST"
            cosign sign "$REF@$DIGEST" --yes
            echo "Verifying provenance attestation exists for $REF"
            cosign verify-attestation "$REF@$DIGEST" --type=provenance || true
          done

      - name: Extract SBOMs via imagetools inspect (SPDX)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p sbom
          for TARGET in plain dotnet java android; do
            REF=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
            OUT=sbom/${TARGET}-sbom.json
            echo "Extracting SBOM for $REF"
            PREDICATE=$(docker buildx imagetools inspect "$REF" --format '{{ json .SBOM.SPDX }}') || {
              echo "No SPDX SBOM data available for $REF" >&2
              continue
            }
            # Wrap predicate in minimal SPDX document envelope
            echo "$PREDICATE" | jq '{
              spdxVersion: "SPDX-2.3",
              dataLicense: "MIT",
              SPDXID: "SPDXRef-DOCUMENT",
              name: "'"$TARGET"'-sbom",
              documentNamespace: "'"$REF"'",
              creationInfo: {
                created: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
                creators: ["Tool: buildkit-syft"]
              },
              packages: .packages,
              relationships: .relationships
            }' > "$OUT"
            echo "SBOM written to $OUT"
          done

      - name: Generate SPDX SBOM for pinned src/dependencies
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, os, re, datetime

          # Explicit purls so GitHub can match versions to advisories.
          # Fallback below derives pkg:github/<owner>/<repo> from download_url,
          # otherwise pkg:generic/<name>.
          PURL_OVERRIDES = {
              "docker-compose": lambda v: f"pkg:github/docker/compose@v{v}",
              "cosign": lambda v: f"pkg:github/sigstore/cosign@v{v}",
              "kustomize": lambda v: f"pkg:github/kubernetes-sigs/kustomize@v{v}",
              "dotnet-sdk": lambda v: f"pkg:github/dotnet/sdk@v{v}",
              "android-sdk": lambda v: f"pkg:generic/google.android-cmdline-tools@{v}",
          }

          def expand_url(tmpl, version, arch="amd64"):
              # Resolve {arch} via download_arch map (amd64 entry) like the Dockerfile does
              return tmpl.replace("{version}", version).replace("{arch}", arch)

          packages = []
          relationships = []
          for path in sorted(glob.glob("src/dependencies/*.json")):
              with open(path) as f:
                  dep = json.load(f)
              name = dep["name"]
              version = dep["version"]
              tmpl = dep.get("download_url", "NOASSERTION")
              arch_map = dep.get("download_arch", {})
              # Pick amd64 release arch for the downloadLocation, mirroring the Dockerfile
              release_arch = arch_map.get("amd64", "amd64") if isinstance(arch_map, dict) else "amd64"
              sha_map = dep.get("sha256") or dep.get("sha512") or {}
              concrete_arch = "amd64"
              if isinstance(sha_map, dict) and concrete_arch not in sha_map and sha_map:
                  concrete_arch = sorted(sha_map.keys())[0]
                  release_arch = arch_map.get(concrete_arch, concrete_arch) if isinstance(arch_map, dict) else concrete_arch
              download = expand_url(tmpl, version, release_arch) if tmpl not in ("NOASSERTION", "NONE", "") else "NOASSERTION"

              if name in PURL_OVERRIDES:
                  purl = PURL_OVERRIDES[name](version)
              else:
                  m = re.search(r"github\.com/([^/]+)/([^/]+)/", tmpl)
                  if m:
                      owner, repo = m.group(1), m.group(2)
                      tag = f"v{version}" if "/v{version}" in tmpl or "/download/v" in tmpl else version
                      purl = f"pkg:github/{owner}/{repo}@{tag}"
                  else:
                      purl = f"pkg:generic/{re.sub(r'[^a-zA-Z0-9_.-]', '-', name).lower()}@{version}"

              spdx_id = "SPDXRef-Package-" + re.sub(r"[^A-Za-z0-9_-]", "-", name)
              packages.append({
                  "SPDXID": spdx_id,
                  "name": name,
                  "versionInfo": version,
                  "downloadLocation": download if download.startswith(("https://", "http://")) else "NOASSERTION",
                  "filesAnalyzed": False,
                  "supplier": "NOASSERTION",
                  "licenseConcluded": "NOASSERTION",
                  "licenseDeclared": "NOASSERTION",
                  "copyrightText": "NOASSERTION",
                  "externalRefs": [{
                      "referenceCategory": "PACKAGE-MANAGER",
                      "referenceType": "purl",
                      "referenceLocator": purl
                  }]
              })
              relationships.append({
                  "spdxElementId": "SPDXRef-DOCUMENT",
                  "relationshipType": "DESCRIBES",
                  "relatedSpdxElement": spdx_id
              })
              print(f"{name}@{version} -> {purl}")

          repo = os.environ.get("GITHUB_REPOSITORY", "hangy/azure-devops-agent")
          sha = os.environ.get("GITHUB_SHA", "local")
          doc = {
              "spdxVersion": "SPDX-2.3",
              "dataLicense": "CC0-1.0",
              "SPDXID": "SPDXRef-DOCUMENT",
              "name": "src-dependencies-sbom",
              "documentNamespace": f"https://github.com/{repo}/sbom/src-dependencies-{sha}",
              "creationInfo": {
                  "created": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "creators": ["Tool: azure-devops-agent-dependencies-sbom", "Organization: hangy"]
              },
              "packages": packages,
              "relationships": relationships
          }
          os.makedirs("sbom", exist_ok=True)
          with open("sbom/dependencies-sbom.json", "w") as f:
              json.dump(doc, f, indent=2)
              f.write("\n")
          print(f"Wrote sbom/dependencies-sbom.json with {len(packages)} packages")
          PY
          cat sbom/dependencies-sbom.json

      - name: Verify SBOM attestations (keyless)
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          for TARGET in plain dotnet java android; do
            REF=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
            echo "Verifying SBOM attestation for $REF (SPDX)"
            cosign verify-attestation "$REF" --type=spdx || echo "Warning: SBOM attestation verification failed for $REF" >&2
          done

      - name: Submit dependencies to GitHub Dependency Graph
        if: github.ref == 'refs/heads/main'
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: sbom/

      - name: Upload SBOM artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 14
