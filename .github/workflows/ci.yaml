name: ci-bake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 3'
  workflow_dispatch:
    inputs:
      trivy_scan:
        description: 'Run Trivy vulnerability scan (true/false)'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TRIVY_SCAN: ${{ github.event.inputs.trivy_scan || 'false' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all targets with bake (non-main local build only)
        if: github.ref != 'refs/heads/main'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl

      - name: Build all targets with bake (main - push to GHCR by digest)
        if: github.ref == 'refs/heads/main'
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          PUSH_GHCR: true
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          source: .
          files: docker-bake.hcl
          push: true

      - name: Inspect pushed images
        if: github.ref == 'refs/heads/main'
        run: |
          for TARGET in plain dotnet java android; do
            echo "=== ${TARGET} ==="
            docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
          done

      - name: Install Trivy
        if: github.ref == 'refs/heads/main' && env.TRIVY_SCAN == 'true'
        run: |
          TRIVY_VERSION=0.69.1
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -o trivy.tar.gz
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Vulnerability scan (fail on HIGH/CRITICAL)
        if: github.ref == 'refs/heads/main' && env.TRIVY_SCAN == 'true'
        run: |
          set -euo pipefail
          FAILED=0
          for TARGET in plain dotnet java android; do
            REF=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
            echo "Scanning $REF"
            trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --timeout 10m "$REF" || FAILED=1
          done
          if [ $FAILED -ne 0 ]; then
            echo "Vulnerability threshold exceeded (HIGH/CRITICAL). Failing build before signing." >&2
            exit 1
          fi

      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        run: |
          COSIGN_VERSION=v3.0.4
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o cosign
          chmod +x cosign
          sudo mv cosign /usr/local/bin/
          cosign version

      - name: Sign images (keyless)
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_RETRY_MAX_ATTEMPTS: "12"
          COSIGN_RETRY_MAX_DELAY: "180"
        run: |
          set -euo pipefail
          source .github/scripts/cosign-with-retry.sh
          for TARGET in plain dotnet java android; do
            REF=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
            DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$REF@$DIGEST" >/dev/null 2>&1; then
              echo "Signature already verified for $REF@$DIGEST"
              continue
            fi
            echo "Signing $REF@$DIGEST"
            cosign_with_retry "/tmp/cosign-sign-${TARGET}.log" true sign --yes "$REF@$DIGEST"
            echo "Verifying signature for $REF@$DIGEST"
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$REF@$DIGEST"
          done

      - name: Extract SBOMs via imagetools inspect (SPDX)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p sbom
          for TARGET in plain dotnet java android; do
            REF=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
            OUT=sbom/${TARGET}-sbom.json
            echo "Extracting SBOM for $REF"
            PREDICATE=$(docker buildx imagetools inspect "$REF" --format '{{ json .SBOM.SPDX }}') || {
              echo "No SPDX SBOM data available for $REF" >&2
              continue
            }
            echo "$PREDICATE" | jq -e 'type == "object" and has("spdxVersion")' > /dev/null 2>&1 || {
              echo "No SPDX SBOM object available for $REF" >&2
              continue
            }
            echo "$PREDICATE" | jq . > "$OUT"
            echo "SBOM written to $OUT"
          done

      - name: Attest and verify SBOMs (keyless)
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_RETRY_MAX_ATTEMPTS: "12"
          COSIGN_RETRY_MAX_DELAY: "180"
        run: |
          set -euo pipefail
          source .github/scripts/cosign-with-retry.sh
          for TARGET in plain dotnet java android; do
            REF=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TARGET}
            DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest.Digest}}' | tr -d '"')
            PREDICATE=sbom/${TARGET}-sbom.json
            if [ ! -f "$PREDICATE" ]; then
              echo "Missing SBOM predicate $PREDICATE for $REF@$DIGEST" >&2
              continue
            fi
            if cosign verify-attestation \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --type spdxjson "$REF@$DIGEST" >/dev/null 2>&1; then
              echo "SBOM attestation already verified for $REF@$DIGEST"
              continue
            fi
            echo "Attesting SBOM for $REF@$DIGEST"
            cosign_with_retry "/tmp/cosign-attest-${TARGET}.log" true \
              attest --yes --predicate "$PREDICATE" --type spdxjson "$REF@$DIGEST"
            echo "Verifying SBOM attestation for $REF@$DIGEST (SPDX)"
            cosign verify-attestation \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --type spdxjson "$REF@$DIGEST"
          done

      - name: Submit dependencies to GitHub Dependency Graph
        if: github.ref == 'refs/heads/main'
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: sbom/

      - name: Upload SBOM artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 14
